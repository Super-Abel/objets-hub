# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → connect github.com/Super-Abel/objets-hub
#
# Provisions 3 resources on the free plan:
#   objets-hub-api    NestJS REST + Socket.IO
#   objets-hub-web    Next.js (SSR)
#   objets-hub-redis  Key Value store for the BullMQ queue
#
# NOT provisioned (Render has no managed MongoDB / S3) — set these yourself as
# secrets on objets-hub-api after the first deploy:
#   MONGODB_URI      MongoDB Atlas free cluster (M0)
#   S3_ACCESS_KEY /  Supabase Storage → Project Settings → Storage → S3 access keys
#   S3_SECRET_KEY
# The rest of the S3_* config (Supabase project whugtketkcxntmwbazmy, eu-west-1)
# is non-secret and baked in below.

services:
  - type: web
    name: objets-hub-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Full origin of the web service. `fromService … property: host` injects a
      # bare service name on the first parallel deploy, which breaks CORS —
      # hardcode it. Adjust if Render appended a suffix to the web URL.
      - key: CORS_ORIGIN
        value: https://objets-hub-web.onrender.com
      - key: OBJECTS_QUEUE_ENABLED
        value: "true"
      - key: OBJECTS_QUEUE_CONCURRENCY
        value: "3"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: objets-hub-redis
          property: connectionString
      # --- secrets: fill in the Render dashboard (sync:false keeps them out of git) ---
      - key: MONGODB_URI
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # --- Supabase Storage (S3-compatible, non-AWS) — non-secret ---
      - key: S3_ENDPOINT
        value: https://whugtketkcxntmwbazmy.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: eu-west-1
      - key: S3_BUCKET
        value: objects
      - key: S3_PUBLIC_URL
        value: https://whugtketkcxntmwbazmy.supabase.co/storage/v1/object/public
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_MAX_IMAGE_BYTES
        value: "5242880"
      # empty: keys live at the bucket root → imageUrl = <public>/objects/<file>
      - key: S3_KEY_PREFIX
        value: ""

  - type: web
    name: objets-hub-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the client bundle at build time — must be the full API URL.
      # `fromService … property: host` injects a bare service name on the first
      # parallel deploy, so hardcode it. Adjust if Render appended a suffix.
      - key: NEXT_PUBLIC_API_URL
        value: https://objets-hub-api.onrender.com

  - type: keyvalue
    name: objets-hub-redis
    plan: free
    region: frankfurt
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: noeviction # required by BullMQ
